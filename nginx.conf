server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # next export with trailing-slash:false emits routes as "route.html"
    # (e.g. /work/gopalan-ai -> work/gopalan-ai.html) instead of route/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico|webp|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
